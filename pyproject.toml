[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interchange-geometry-benchmark"
version = "1.0.0"
description = "Cap-X style vectorised screening of diamond, DDI and turbo-roundabout interchanges."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "pandas>=2.2", "pydantic>=2.6,<3", "matplotlib>=3.8"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
ixbench = "ixbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
